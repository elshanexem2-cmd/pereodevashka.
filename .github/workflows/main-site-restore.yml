name: Main site index.html - inspect backup
on:
  push:
    paths: ['.github/workflows/main-site-restore.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download backup archive and list it (nothing is uploaded)
        run: |
          curl -sSL -o backup.tgz "https://drive.usercontent.google.com/download?id=1kp3gE5ms_mTChXQFW8CzpnE2jXV3vD2G&export=download&confirm=t"
          tar -tzvf backup.tgz > list.txt
          echo "== index.html files:"; grep -i 'index\.html' list.txt | grep -v '/pereodevashka/'
          echo "== top of main site:"; grep -vE '/pereodevashka/|/(img|media)/' list.txt | grep -i 'memorybox.by' | head -40
