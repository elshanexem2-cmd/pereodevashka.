name: Main site - remove the 16 studio files wrongly uploaded into root
on:
  push:
    paths: ['.github/workflows/main-site-restore.yml']
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq lftp
      - name: Remove exactly the 16 extra items (confirmed by owner), nothing else
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          lftp -u "$U,$P" "$H" -e "set ftp:ssl-allow no; cd memorybox.by || exit 1; \
            rm -f .htaccess index.php api.php lib.php tg.php login.php setup.php sw.js manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png icon-maskable-512.png; \
            rm -rf books guide landing; echo '== root now:'; cls -a; bye"
