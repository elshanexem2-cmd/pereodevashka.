name: Deploy to hosting
# Manual only: nothing goes to the server without the owner's go-ahead.
on:
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq lftp
      - name: Upload changed files (never deletes anything on the server)
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          # The studio lives in memorybox.by/pereodevashka/ (next to the main memorybox.by site). Find it from whatever FTP home is set,
          # and refuse to deploy anywhere else so the main site is never touched.
          ls1() { curl -sS --max-time 30 --user "$U:$P" "ftp://$H/$1" --list-only; }
          if ls1 "memorybox.by/pereodevashka/" | grep -qx 'tg.php'; then DIR=memorybox.by/pereodevashka/
          elif ls1 "pereodevashka/" | grep -qx 'tg.php'; then DIR=pereodevashka/
          elif ls1 "" | grep -qx 'tg.php' && ! ls1 "" | grep -qx 'pereodevashka'; then DIR=./
          else echo "Studio folder not found - nothing deployed"; exit 1; fi
          echo "Deploying into: $DIR"
          lftp -u "$U,$P" "$H" -e "set ftp:ssl-allow no; set net:max-retries 3; \
            mirror -R --only-newer --ignore-time --verbose \
              -x '^\.git' -x '^\.github/' -x '^README\.md$' \
              -x '^\.memorybox-config\.php$' -x '^\.mb-' -x '^mb-update\.php$' -x '^\.install\.lock$' \
              ./ $DIR; bye"
