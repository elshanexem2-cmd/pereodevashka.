name: FTP check
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/ftp-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP folder
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
        run: |
          curl -sS --max-time 30 --user "$U:$P" "ftp://$H/" -X "LIST -a" || true
          echo "== pwd"; curl -sS --max-time 30 --user "$U:$P" "ftp://$H/" -Q "PWD" --list-only -v 2>&1 | grep -E "^< 257" || true
